services:
  jekyll:
    build:
      context: .
      dockerfile: Dockerfile.jekyll
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll
      - /srv/jekyll/vendor/bundle
    environment:
      - JEKYLL_ENV=development

  pdf-generator:
    build:
      context: .
      dockerfile: Dockerfile.pandoc
    volumes:
      - .:/srv/jekyll
    command: bash -c "/scripts/build/build-handbook.sh && /scripts/build/build-appendices.sh"
    profiles:
      - pdf
