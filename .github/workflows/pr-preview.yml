name: Deploy PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        if: github.event.action != 'closed'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Pandoc and LaTeX
        if: github.event.action != 'closed'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-xetex

      - name: Generate PDFs
        if: github.event.action != 'closed'
        run: |
          chmod +x scripts/build/build-handbook-simple.sh
          chmod +x scripts/utils/convert_images_to_latex.py
          mkdir -p assets/files/handbook
          ./scripts/build/build-handbook-simple.sh

      - name: Determine site URL
        id: site
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO=$(basename "${{ github.repository }}")
          if [ -n "${{ vars.SITE_URL }}" ]; then
            PAGES_BASE=$(echo "${{ vars.SITE_URL }}" | sed 's|https://||')
            BASEURL="/pr-preview/pr-${{ github.event.number }}"
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ] && [ -f CNAME ]; then
            PAGES_BASE=$(cat CNAME | tr -d '[:space:]')
            BASEURL="/pr-preview/pr-${{ github.event.number }}"
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            PAGES_BASE="${OWNER}.github.io"
            BASEURL="/pr-preview/pr-${{ github.event.number }}"
          else
            PAGES_BASE="${OWNER}.github.io/${REPO}"
            BASEURL="/${REPO}/pr-preview/pr-${{ github.event.number }}"
          fi
          echo "pages_base_url=${PAGES_BASE}" >> $GITHUB_OUTPUT
          echo "baseurl=${BASEURL}" >> $GITHUB_OUTPUT

      - name: Build Jekyll site
        if: github.event.action != 'closed'
        run: bundle exec jekyll build --baseurl "${{ steps.site.outputs.baseurl }}"
        env:
          JEKYLL_ENV: production

      - name: Add .nojekyll
        if: github.event.action != 'closed'
        run: touch ./_site/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site/
          preview-branch: pages-deploy
          pages-base-url: ${{ steps.site.outputs.pages_base_url }}
