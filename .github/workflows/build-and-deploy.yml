name: Build Jekyll site and generate PDFs

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Set vars.SITE_URL in repo Settings → Variables → Actions to override the auto-detected site URL
  # To override test severity, set these in Settings → Secrets and variables → Actions → Variables:
  #   WARN_ONLY_SELF_URLS     = 'true'  to make internal URL failures non-blocking (default: false)
  #   WARN_ONLY_EXTERNAL_LINKS = 'false' to make external link failures blocking  (default: true)
  #   WARN_ONLY_PDF_LINKS      = 'false' to make PDF link failures blocking       (default: true)

jobs:
  prepare-pandoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if pandoc image sources changed
        id: pandoc-changed
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -qE '(Dockerfile\.pandoc|scripts/build/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull or build pandoc image
        run: |
          if [ "${{ steps.pandoc-changed.outputs.changed }}" = "false" ] && docker pull ghcr.io/${{ github.repository_owner }}/troop500-pandoc:latest; then
            echo "Pulled pre-built pandoc image from GHCR"
          else
            echo "Building pandoc image from Dockerfile.pandoc"
            docker build -t ghcr.io/${{ github.repository_owner }}/troop500-pandoc:latest -f Dockerfile.pandoc .
            echo "Pushing newly built pandoc image to GHCR for future runs"
            docker push ghcr.io/${{ github.repository_owner }}/troop500-pandoc:latest
          fi

      - name: Save pandoc image
        run: docker save ghcr.io/${{ github.repository_owner }}/troop500-pandoc:latest | gzip > pandoc-image.tar.gz

      - name: Upload pandoc image artifact
        uses: actions/upload-artifact@v7
        with:
          name: pandoc-image
          path: pandoc-image.tar.gz
          retention-days: 1

  prepare-jekyll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if jekyll image sources changed
        id: jekyll-changed
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -qE '(Dockerfile\.jekyll|Gemfile|Gemfile\.lock|millennial\.gemspec)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull or build jekyll image
        run: |
          if [ "${{ steps.jekyll-changed.outputs.changed }}" = "false" ] && docker pull ghcr.io/${{ github.repository_owner }}/troop500-jekyll:latest; then
            echo "Pulled pre-built jekyll image from GHCR"
          else
            echo "Building jekyll image from Dockerfile.jekyll"
            docker build -t ghcr.io/${{ github.repository_owner }}/troop500-jekyll:latest -f Dockerfile.jekyll .
            echo "Pushing newly built jekyll image to GHCR for future runs"
            docker push ghcr.io/${{ github.repository_owner }}/troop500-jekyll:latest
          fi

      - name: Save jekyll image
        run: docker save ghcr.io/${{ github.repository_owner }}/troop500-jekyll:latest | gzip > jekyll-image.tar.gz

      - name: Upload jekyll image artifact
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-image
          path: jekyll-image.tar.gz
          retention-days: 1

  build-pdfs:
    runs-on: ubuntu-latest
    needs: prepare-pandoc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download pandoc image artifact
        uses: actions/download-artifact@v8
        with:
          name: pandoc-image

      - name: Load pandoc image
        run: |
          docker load < pandoc-image.tar.gz
          rm pandoc-image.tar.gz

      - name: Generate PDFs
        run: |
          mkdir -p assets/files/handbook
          docker run --rm \
            --user root \
            -v ${{ github.workspace }}:/srv/jekyll \
            ghcr.io/${{ github.repository_owner }}/troop500-pandoc:latest \
            bash /srv/jekyll/scripts/build/build-handbook-simple.sh

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: handbook-pdfs
          path: assets/files/handbook/

  build-jekyll:
    runs-on: ubuntu-latest
    needs: prepare-jekyll
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download jekyll image artifact
        uses: actions/download-artifact@v8
        with:
          name: jekyll-image

      - name: Load jekyll image
        run: |
          docker load < jekyll-image.tar.gz
          rm jekyll-image.tar.gz

      - name: Compute site URL and config override
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO=$(basename "${{ github.repository }}")
          if [ -n "${{ vars.SITE_URL }}" ]; then
            URL="${{ vars.SITE_URL }}"
            BASEURL=""
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ] && [ -f CNAME ]; then
            URL="https://$(cat CNAME | tr -d '[:space:]')"
            BASEURL=""
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            URL="https://${OWNER}.github.io"
            BASEURL=""
          else
            URL="https://${OWNER}.github.io"
            BASEURL="/${REPO}"
          fi
          echo "Site: ${URL}${BASEURL}"
          printf 'url: "%s"\nbaseurl: "%s"\n' "$URL" "$BASEURL" > _config_ci.yml

      - name: Build Jekyll site
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/srv/jekyll \
            -e JEKYLL_ENV=production \
            ghcr.io/${{ github.repository_owner }}/troop500-jekyll:latest \
            sh -c "bundle exec jekyll build --config _config.yml,_config_ci.yml && touch /srv/jekyll/_site/.nojekyll"

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-site
          path: ./_site/

  deploy:
    runs-on: ubuntu-latest
    needs: [build-jekyll, build-pdfs]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: jekyll-site
          path: ./_site/

      - name: Download PDF artifacts
        uses: actions/download-artifact@v8
        with:
          name: handbook-pdfs
          path: ./_site/assets/files/handbook/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: pages-deploy
          folder: ./_site
          clean-exclude: pr-preview
          force: false

  test-self-urls:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: ${{ vars.WARN_ONLY_SELF_URLS == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine site URL
        id: site
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO=$(basename "${{ github.repository }}")
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "url=${{ vars.SITE_URL }}" >> $GITHUB_OUTPUT
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ] && [ -f CNAME ]; then
            echo "url=https://$(cat CNAME | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            echo "url=https://${OWNER}.github.io" >> $GITHUB_OUTPUT
          else
            echo "url=https://${OWNER}.github.io/${REPO}" >> $GITHUB_OUTPUT
          fi

      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Test internal page URLs
        run: pwsh scripts/test/test-self-urls.ps1 -BaseUrl "${{ steps.site.outputs.url }}"

  test-external-links:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: ${{ vars.WARN_ONLY_EXTERNAL_LINKS != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine site URL
        id: site
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO=$(basename "${{ github.repository }}")
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "url=${{ vars.SITE_URL }}" >> $GITHUB_OUTPUT
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ] && [ -f CNAME ]; then
            echo "url=https://$(cat CNAME | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            echo "url=https://${OWNER}.github.io" >> $GITHUB_OUTPUT
          else
            echo "url=https://${OWNER}.github.io/${REPO}" >> $GITHUB_OUTPUT
          fi

      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Test external links
        run: pwsh scripts/test/test-external-links.ps1 -BaseUrl "${{ steps.site.outputs.url }}"

  test-pdf-links:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: ${{ vars.WARN_ONLY_PDF_LINKS != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download PDF artifacts
        uses: actions/download-artifact@v8
        with:
          name: handbook-pdfs
          path: assets/files/handbook/

      - name: Test PDF links
        run: pwsh scripts/test/test-pdf-links.ps1 -PdfDirectory "assets/files/handbook"