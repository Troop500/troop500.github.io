name: Build Jekyll site and generate PDFs

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_URL: "https://murphy360.github.io/troop500dev.github.io"
  # To override test severity, set these in Settings → Secrets and variables → Actions → Variables:
  #   WARN_ONLY_SELF_URLS     = 'true'  to make internal URL failures non-blocking (default: false)
  #   WARN_ONLY_EXTERNAL_LINKS = 'false' to make external link failures blocking  (default: true)
  #   WARN_ONLY_PDF_LINKS      = 'false' to make PDF link failures blocking       (default: true)

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-xetex

      - name: Generate PDFs
        run: |
          chmod +x scripts/build/build-handbook-simple.sh
          chmod +x scripts/utils/convert_images_to_latex.py
          mkdir -p assets/files/handbook
          ./scripts/build/build-handbook-simple.sh

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handbook-pdfs
          path: assets/files/handbook/

  build-jekyll:
    runs-on: ubuntu-latest
    needs: build-pdfs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: handbook-pdfs
          path: assets/files/handbook/

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Add .nojekyll
        run: touch ./_site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: ./_site/

  deploy:
    runs-on: ubuntu-latest
    needs: build-jekyll
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: ./_site/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: pages-deploy
          folder: ./_site
          clean-exclude: pr-preview
          force: false

  test-self-urls:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: ${{ vars.WARN_ONLY_SELF_URLS == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Test internal page URLs
        run: pwsh scripts/test/test-self-urls.ps1 -BaseUrl "${{ env.SITE_URL }}"

  test-external-links:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: ${{ vars.WARN_ONLY_EXTERNAL_LINKS != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Test external links
        run: pwsh scripts/test/test-external-links.ps1 -BaseUrl "${{ env.SITE_URL }}"

  test-pdf-links:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: ${{ vars.WARN_ONLY_PDF_LINKS != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: handbook-pdfs
          path: assets/files/handbook/

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Test PDF links
        run: pwsh scripts/test/test-pdf-links.ps1 -PdfDirectory "assets/files/handbook"