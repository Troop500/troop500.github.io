name: Build and Publish Docker Containers

# Builds and pushes images to GHCR only when Dockerfiles change.
# The main build-and-deploy workflow pulls these pre-built images,
# avoiding repeated slow installs (LaTeX packages, gem installs, etc.)

on:
  push:
    branches: [ gh-pages ]
    paths:
      - 'Dockerfile.pandoc'
      - 'Dockerfile.jekyll'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'millennial.gemspec'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-pandoc-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push pandoc image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.pandoc
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/troop500-pandoc:latest
          # Cache build layers in the GitHub Actions cache between runs
          cache-from: type=gha,scope=pandoc
          cache-to: type=gha,mode=max,scope=pandoc

  build-jekyll-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push jekyll image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.jekyll
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/troop500-jekyll:latest
          # Cache build layers in the GitHub Actions cache between runs
          cache-from: type=gha,scope=jekyll
          cache-to: type=gha,mode=max,scope=jekyll
