---
layout: default
---

<style>
.handbook-container {
  display: flex;
  max-width: 1200px;
  margin: 0 auto;
  gap: 2rem;
}

.handbook-sidebar {
  flex: 0 0 250px;
  position: sticky;
  top: 80px; /* clear the fixed site-header (56px) + breathing room */
  height: fit-content;
  background: #f8f9fa;
  border: 1px solid #dee2e6;
  border-radius: 8px;
  padding: 1rem;
  margin-bottom: 2rem;
}

.handbook-sidebar h3 {
  margin-top: 0;
  font-size: 1.1rem;
  color: #495057;
  border-bottom: 2px solid #007bff;
  padding-bottom: 0.5rem;
}

.handbook-toc {
  list-style: none;
  padding: 0;
  margin: 0;
}

.handbook-toc li {
  margin-bottom: 0.25rem;
}

.handbook-toc a {
  display: block;
  padding: 0.25rem 0.5rem;
  color: #495057;
  text-decoration: none;
  border-radius: 4px;
  transition: all 0.2s ease;
  font-size: 0.9rem;
}

.handbook-toc a:hover {
  background-color: #007bff;
  color: white;
  text-decoration: none;
}

.handbook-toc .toc-h2 {
  font-weight: 600;
  margin-top: 0.5rem;
}

.handbook-toc .toc-h2-child {
  padding-left: 1rem;
  font-size: 0.85rem;
  font-weight: 400;
  color: #6c757d;
  margin-bottom: 0.15rem;
  display: none; /* Hidden by default */
}

.handbook-toc .toc-h2-children {
  list-style: none;
  padding: 0;
  margin: 0;
}

.handbook-toc .toc-h1.active {
  background-color: #e3f2fd;
  font-weight: 600;
}

.handbook-content {
  flex: 1;
  min-width: 0;
}

.handbook-content h1 {
  margin-top: 0;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
  .handbook-container {
    flex-direction: column;
  }
  
  .handbook-sidebar {
    position: relative;
    flex: none;
    order: -1;
  }
}
</style>

<div class="handbook-container">
  <nav class="handbook-sidebar">
    <h3>📖 Sections</h3>
    <ul class="handbook-toc" id="handbook-toc">
      <!-- TOC will be generated by JavaScript -->
    </ul>
  </nav>
  
  <div class="handbook-content">
    <h1>{{ page.title }}</h1>
    <article>
      {{ content }}
    </article>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const tocContainer = document.getElementById('handbook-toc');
  const headings = document.querySelectorAll('.handbook-content h1, .handbook-content h2');
  // Account for the fixed site-header plus a small breathing room
  const siteHeader = document.querySelector('.site-header');
  const SCROLL_OFFSET = (siteHeader ? siteHeader.offsetHeight : 0) + 16;

  // Track used IDs to guarantee uniqueness
  const usedIds = new Set();
  // Map each heading element to its TOC link for direct lookup (no querySelector needed)
  const headingToLink = new Map();
  // Map each TOC link to its heading element for click navigation
  const linkToHeading = new Map();

  let currentH2Container = null;
  let isManualNavigation = false;

  // ── Build TOC ──────────────────────────────────────────────────────
  headings.forEach(function(heading, index) {
    // Skip the page title (first H1)
    if (heading.tagName === 'H1' && index === 0) return;

    // Generate a unique slug-based ID
    let baseId = heading.textContent.toLowerCase()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/--+/g, '-')
      .trim();
    let uniqueId = baseId;
    let suffix = 2;
    while (usedIds.has(uniqueId)) {
      uniqueId = baseId + '-' + suffix++;
    }
    usedIds.add(uniqueId);
    heading.id = uniqueId;

    if (heading.tagName === 'H1') {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + uniqueId;
      a.textContent = heading.textContent;
      a.className = 'toc-h1';
      li.appendChild(a);

      const h2List = document.createElement('ul');
      h2List.className = 'toc-h2-children';
      li.appendChild(h2List);

      tocContainer.appendChild(li);
      currentH2Container = h2List;

      headingToLink.set(heading, a);
      linkToHeading.set(a, heading);

    } else if (heading.tagName === 'H2' && currentH2Container) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + uniqueId;
      a.textContent = heading.textContent.trim();
      a.className = 'toc-h2-child';
      a.style.display = 'none';
      li.appendChild(a);
      currentH2Container.appendChild(li);

      headingToLink.set(heading, a);
      linkToHeading.set(a, heading);
    }
  });

  // ── Scroll-to helper ───────────────────────────────────────────────
  // Single smooth scroll with offset — no double-jump.
  function scrollToHeading(heading) {
    const top = heading.getBoundingClientRect().top + window.pageYOffset - SCROLL_OFFSET;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }

  // ── Activate a given H1 section in the sidebar ─────────────────────
  function activateH1(link) {
    if (!link) return;
    // Deactivate all
    document.querySelectorAll('.toc-h1').forEach(function(h1) {
      h1.classList.remove('active');
      var children = h1.parentElement.querySelectorAll('.toc-h2-child');
      children.forEach(function(c) { c.style.display = 'none'; });
    });
    // Activate target
    link.classList.add('active');
    var children = link.parentElement.querySelectorAll('.toc-h2-child');
    children.forEach(function(c) { c.style.display = 'block'; });
  }

  // ── Click handlers (event delegation) ──────────────────────────────
  tocContainer.addEventListener('click', function(e) {
    var a = e.target.closest('a');
    if (!a || !linkToHeading.has(a)) return;
    e.preventDefault();

    isManualNavigation = true;

    if (a.classList.contains('toc-h1')) {
      activateH1(a);
    }

    scrollToHeading(linkToHeading.get(a));
  });

  // Re-enable scroll tracking once the browser finishes scrolling.
  // 'scrollend' is supported in modern browsers; fall back to a
  // debounced scroll listener for older ones.
  if ('onscrollend' in window) {
    window.addEventListener('scrollend', function() {
      isManualNavigation = false;
    });
  } else {
    var scrollTimer;
    window.addEventListener('scroll', function() {
      if (isManualNavigation) {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function() {
          isManualNavigation = false;
        }, 150);
      }
    });
  }

  // ── Scroll-spy via IntersectionObserver ─────────────────────────────
  // Fires only when headings enter/leave the top of the viewport —
  // far more reliable (and performant) than a scroll-event loop.
  var lastActiveH1Link = null;

  var observer = new IntersectionObserver(function(entries) {
    if (isManualNavigation) return;

    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;

      var heading = entry.target;
      // Walk up to the parent H1 if this is an H2
      var h1Heading = heading;
      if (heading.tagName === 'H2') {
        // Find the preceding H1
        var prev = heading.previousElementSibling;
        while (prev) {
          if (prev.tagName === 'H1') { h1Heading = prev; break; }
          prev = prev.previousElementSibling;
        }
        // If no sibling found, search all tracked headings
        if (h1Heading === heading) {
          var allH1s = Array.from(headingToLink.keys()).filter(function(h) {
            return h.tagName === 'H1';
          });
          for (var i = allH1s.length - 1; i >= 0; i--) {
            if (allH1s[i].compareDocumentPosition(heading) & Node.DOCUMENT_POSITION_FOLLOWING) {
              h1Heading = allH1s[i];
              break;
            }
          }
        }
      }

      var link = headingToLink.get(h1Heading);
      if (link && link !== lastActiveH1Link) {
        lastActiveH1Link = link;
        activateH1(link);
      }
    });
  }, {
    rootMargin: '-' + SCROLL_OFFSET + 'px 0px -70% 0px',
    threshold: 0
  });

  // Observe all headings that are in the TOC
  headingToLink.forEach(function(_link, heading) {
    observer.observe(heading);
  });

  // ── Initial state ──────────────────────────────────────────────────
  var firstH1Link = document.querySelector('.toc-h1');
  if (firstH1Link) {
    activateH1(firstH1Link);
    lastActiveH1Link = firstH1Link;
  }
});
</script>
