---
layout: default
---

<style>
.handbook-container {
  display: flex;
  max-width: 1200px;
  margin: 0 auto;
  gap: 2rem;
}

.handbook-sidebar {
  flex: 0 0 250px;
  position: sticky;
  top: 2rem;
  height: fit-content;
  background: #f8f9fa;
  border: 1px solid #dee2e6;
  border-radius: 8px;
  padding: 1rem;
  margin-bottom: 2rem;
}

.handbook-sidebar h3 {
  margin-top: 0;
  font-size: 1.1rem;
  color: #495057;
  border-bottom: 2px solid #007bff;
  padding-bottom: 0.5rem;
}

.handbook-toc {
  list-style: none;
  padding: 0;
  margin: 0;
}

.handbook-toc li {
  margin-bottom: 0.25rem;
}

.handbook-toc a {
  display: block;
  padding: 0.25rem 0.5rem;
  color: #495057;
  text-decoration: none;
  border-radius: 4px;
  transition: all 0.2s ease;
  font-size: 0.9rem;
}

.handbook-toc a:hover {
  background-color: #007bff;
  color: white;
  text-decoration: none;
}

.handbook-toc .toc-h2 {
  font-weight: 600;
  margin-top: 0.5rem;
}

.handbook-toc .toc-h2-child {
  padding-left: 1rem;
  font-size: 0.85rem;
  font-weight: 400;
  color: #6c757d;
  margin-bottom: 0.15rem;
  display: none; /* Hidden by default */
}

.handbook-toc .toc-h2-children {
  list-style: none;
  padding: 0;
  margin: 0;
}

.handbook-toc .toc-h1.active {
  background-color: #e3f2fd;
  font-weight: 600;
}

.handbook-content {
  flex: 1;
  min-width: 0;
}

.handbook-content h1 {
  margin-top: 0;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
  .handbook-container {
    flex-direction: column;
  }
  
  .handbook-sidebar {
    position: relative;
    flex: none;
    order: -1;
  }
}
</style>

<div class="handbook-container">
  <nav class="handbook-sidebar">
    <h3>📖 Sections</h3>
    <ul class="handbook-toc" id="handbook-toc">
      <!-- TOC will be generated by JavaScript -->
    </ul>
  </nav>
  
  <div class="handbook-content">
    <h1>{{ page.title }}</h1>
    <article>
      {{ content }}
    </article>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Auto-generate table of contents from headings
  const tocContainer = document.getElementById('handbook-toc');
  const headings = document.querySelectorAll('.handbook-content h1, .handbook-content h2');
  
  let currentH1Container = null;
  let currentH2Container = null;
  let isManualNavigation = false; // Flag to prevent scroll interference
  
  headings.forEach(function(heading, index) {
    // Skip the main title
    if (heading.tagName === 'H1' && index === 0) return;
    
    // Create unique ID if it doesn't exist
    if (!heading.id) {
      heading.id = heading.textContent.toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/--+/g, '-')
        .trim();
    }
    
    if (heading.tagName === 'H1') {
      // Create H1 entry
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + heading.id;
      a.textContent = heading.textContent;
      a.className = 'toc-h1';
      
      li.appendChild(a);
      
      // Create container for H2 children
      const h2Container = document.createElement('ul');
      h2Container.className = 'toc-h2-children';
      li.appendChild(h2Container);
      
      tocContainer.appendChild(li);
      currentH1Container = li;
      currentH2Container = h2Container;
      
      // Add click handler for H1
      a.addEventListener('click', function(e) {
        e.preventDefault();
        
        // Set flag to prevent scroll interference
        isManualNavigation = true;
        
        // Remove active class from all H1s and hide all H2 children
        document.querySelectorAll('.toc-h1').forEach(h1 => {
          h1.classList.remove('active');
          const parentLi = h1.parentElement;
          const h2Container = parentLi.querySelector('.toc-h2-children');
          if (h2Container) {
            const h2Children = h2Container.querySelectorAll('.toc-h2-child');
            h2Children.forEach(h2 => h2.style.display = 'none');
          }
        });
        
        // Add active class to clicked H1 and show its H2 children
        this.classList.add('active');
        const parentLi = this.parentElement;
        const h2Container = parentLi.querySelector('.toc-h2-children');
        if (h2Container) {
          const h2Children = h2Container.querySelectorAll('.toc-h2-child');
          h2Children.forEach(h2 => h2.style.display = 'block');
        }
        
        // Scroll to target
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
          // Add a small offset to ensure title is clearly visible
          setTimeout(() => {
            window.scrollBy(0, -20);
            // Re-enable scroll tracking after navigation is complete
            setTimeout(() => {
              isManualNavigation = false;
            }, 100);
          }, 500);
        }
      });
      
    } else if (heading.tagName === 'H2' && currentH2Container) {
      // Create H2 entry as child of current H1
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + heading.id;
      a.textContent = heading.textContent.trim();
      a.className = 'toc-h2-child';
      a.style.display = 'none'; // Start hidden
      
      li.appendChild(a);
      currentH2Container.appendChild(li);
      
      // Add click handler for H2
      a.addEventListener('click', function(e) {
        e.preventDefault();
        
        // Set flag to prevent scroll interference
        isManualNavigation = true;
        
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
          // Add a small offset to ensure title is clearly visible
          setTimeout(() => {
            window.scrollBy(0, -20);
            // Re-enable scroll tracking after navigation is complete
            setTimeout(() => {
              isManualNavigation = false;
            }, 100);
          }, 500);
        }
      });
    }
  });
  
  // Auto-activate first H1 on page load
  const firstH1 = document.querySelector('.toc-h1');
  if (firstH1) {
    firstH1.classList.add('active');
    const parentLi = firstH1.parentElement;
    const h2Container = parentLi.querySelector('.toc-h2-children');
    if (h2Container) {
      const h2Children = h2Container.querySelectorAll('.toc-h2-child');
      h2Children.forEach(h2 => h2.style.display = 'block');
    }
  }
  
  // Update active section based on scroll position
  window.addEventListener('scroll', function() {
    // Skip if manual navigation is in progress
    if (isManualNavigation) return;
    
    const headings = document.querySelectorAll('.handbook-content h1, .handbook-content h2');
    let currentSection = null;
    
    headings.forEach(function(heading) {
      const rect = heading.getBoundingClientRect();
      if (rect.top <= 100) {
        currentSection = heading;
      }
    });
    
    if (currentSection && currentSection.tagName === 'H1') {
      // Remove active from all H1s and hide all H2 children
      document.querySelectorAll('.toc-h1').forEach(h1 => {
        h1.classList.remove('active');
        const parentLi = h1.parentElement;
        const h2Container = parentLi.querySelector('.toc-h2-children');
        if (h2Container) {
          const h2Children = h2Container.querySelectorAll('.toc-h2-child');
          h2Children.forEach(h2 => h2.style.display = 'none');
        }
      });
      
      // Activate current H1 and show its H2 children
      const activeLink = document.querySelector(`.toc-h1[href="#${currentSection.id}"]`);
      if (activeLink) {
        activeLink.classList.add('active');
        const parentLi = activeLink.parentElement;
        const h2Container = parentLi.querySelector('.toc-h2-children');
        if (h2Container) {
          const h2Children = h2Container.querySelectorAll('.toc-h2-child');
          h2Children.forEach(h2 => h2.style.display = 'block');
        }
      }
    }
  });
});
</script>
